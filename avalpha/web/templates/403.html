<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members only · {{ fund_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
</head>
<body class="denied-body">
  <div class="grain" aria-hidden="true"></div>
  <main class="denied">
    <span class="denied-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <p class="eyebrow">{{ fund_name }}</p>
    <h1>Members only.</h1>
    <p class="lede">This console is restricted to {{ fund_name }} members. Sign in through the fund's access portal to continue.</p>
    <p class="denied-reason">{{ reason }}</p>
  </main>
</body>
</html>
