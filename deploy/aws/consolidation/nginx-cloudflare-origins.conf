# Valence and Overstory both have dashboard-managed Cloudflare routes pointing
# at localhost:8080. Dispatch by the preserved public Host header so those
# routes do not need to change during consolidation.
server {
    listen 127.0.0.1:8080 default_server;
    server_name valence.arboretuminvestments.net;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name overstory.arboretuminvestments.net;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
