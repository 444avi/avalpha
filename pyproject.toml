[project]
name = "avalpha"
version = "0.1.0"
description = "Portfolio monitoring: watches public information about held tickers, emails a morning PDF digest."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "praw>=7.7",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "weasyprint>=61",
    "click>=8.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
avalpha = "avalpha.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["avalpha", "avalpha.collectors", "avalpha.digest", "avalpha.web"]

[tool.setuptools.package-data]
"avalpha.digest" = ["*.html"]
"avalpha.web" = ["templates/*.html", "static/*"]
